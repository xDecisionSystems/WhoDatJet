{% extends "base.html" %}{% block title %}Sign in · WhoDatJet{% endblock %}
{% block body %}<div class="card" style="max-width:26rem;margin:2rem auto"><h1>Sign in</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}">
<label for="u">Username</label><input id="u" name="username" autocomplete="username" required autofocus>
<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
<p><button>Sign in</button></p></form></div>{% endblock %}
