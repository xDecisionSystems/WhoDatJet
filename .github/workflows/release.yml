# Builds, tests, signs and publishes a WhoDatJet release when a version tag (v*) is pushed.
#
# Trust model: the only way to produce a valid signature is this workflow, running in this repository on a
# `v*` tag. `manifest.json` lists the SHA-256 of every asset and is signed with Sigstore keyless signing
# (`cosign sign-blob`), so there is no private key to store, lose or rotate. The installers and
# `whodatjet-update` verify that signature (certificate identity = this workflow at this tag, OIDC issuer =
# GitHub Actions) before trusting any asset. Protect the `v*` tags with a repository tag ruleset.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release
  id-token: write   # Sigstore keyless signing

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Tag must match the package version
        run: |
          set -euo pipefail
          pkg="v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $pkg" >&2; exit 1
          fi

      - name: Test
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run ruff check src tests
          uv run mypy src
          uv run pytest -q

      - name: Build assets
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          mkdir -p dist
          # Scripts carry their release version, so a release's installer installs that same release.
          sed "s/@VERSION@/$tag/g" deploy/proxmox/install.sh > dist/install.sh
          sed "s/@VERSION@/$tag/g" deploy/install.sh        > dist/guest-install.sh
          cp deploy/whodatjet-update dist/whodatjet-update
          git archive --format=tar.gz --prefix="whodatjet-$tag/" -o "dist/whodatjet-$tag.tar.gz" HEAD \
            src pyproject.toml uv.lock deploy docs README.md
          python3 - "$tag" "$GITHUB_SHA" <<'PY'
          import hashlib, json, os, sys
          tag, commit = sys.argv[1:3]
          assets = {}
          for name in sorted(os.listdir("dist")):
              data = open(os.path.join("dist", name), "rb").read()
              assets[name] = {"sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}
          manifest = {"schema": 1, "version": tag, "commit": commit,
                      "repository": os.environ["GITHUB_REPOSITORY"], "assets": assets}
          open("dist/manifest.json", "w").write(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PY
          cat dist/manifest.json

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3 (installs cosign v3.1.4)

      - name: Sign the manifest (keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle dist/manifest.json.sigstore.json dist/manifest.json
          cosign verify-blob --bundle dist/manifest.json.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/manifest.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
