[project]
name = "whodatjet"
version = "0.1.2"
description = "FAA aircraft registry history service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "boto3>=1.35",
    "fastapi>=0.115",
    "holidays>=0.50",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "uvicorn>=0.30",
]

[project.scripts]
whodatjet = "whodatjet.cli:main"

[dependency-groups]
dev = [
    "moto[s3]>=5.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whodatjet"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
